[project]
name = "ai-trading-brain"
version = "0.1.0"
description = "AI Trading Brain — unified autonomous trading system combining quant signals, Claude reasoning, and automated execution"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.40",
    "anthropic>=0.40.0",
    "alpaca-trade-api>=3.2.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=9.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
]

[tool.uv.sources]
nq-signals = { path = "../NeuralQuant/packages/signals" }
nq-api = { path = "../NeuralQuant/apps/api" }
nq-data = { path = "../NeuralQuant/packages/data" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
